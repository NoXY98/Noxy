<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>OperaDNA - Chinese Opera Analyzer</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@300;500;700&family=ZCOOL+XiaoWei&display=swap" rel="stylesheet">
    <script>
      tailwind.config = {
        theme: {
          extend: {
            colors: {
              'opera-red': '#8E0000',
              'opera-gold': '#D4AF37',
              'opera-black': '#1A1A1A',
              'opera-paper': '#F5EFE0',
            },
            fontFamily: {
              serif: ['"Noto Serif SC"', 'serif'],
              display: ['"ZCOOL XiaoWei"', 'serif'],
            }
          }
        }
      }
    </script>
    <style>
      body {
        background-color: #F5EFE0;
        color: #1A1A1A;
      }
      .ink-brush {
        mask-image: url('https://upload.wikimedia.org/wikipedia/commons/f/f7/Paint_brush_stroke.png');
        mask-size: cover;
        -webkit-mask-image: url('https://upload.wikimedia.org/wikipedia/commons/f/f7/Paint_brush_stroke.png');
        -webkit-mask-size: cover;
      }
    </style>
  <script type="importmap">
{
  "imports": {
    "react": "https://esm.sh/react@^19.2.4",
    "react-dom/": "https://esm.sh/react-dom@^19.2.4/",
    "react/": "https://esm.sh/react@^19.2.4/",
    "@google/genai": "https://esm.sh/@google/genai@^1.38.0"
  }
}
</script>
</head>
  <body>
    <div id="root"></div>
  </body>
</html>
